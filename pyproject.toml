[project]
name = "phishir"
version = "1.0.0"
description = "SOAR-lite phishing incident response pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dinesh Melimi" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
phishir = "phishir.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phishir"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI dependency-injection idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests"]
